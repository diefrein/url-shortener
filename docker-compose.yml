version: '3'

services:
  urlshortener:
    container_name: urlshortener
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      REMOVE_EXPIRED_URLS_INTERVAL_SECONDS: 600
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hse_python_hw3
      BACKEND_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # restart: unless-stopped
    ports:
      - "8080:8080"

  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hse_python_hw3
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2
    container_name: redis
    ports:
      - "6379:6379"
    # volumes:
      # - redis_data:/data
    # command: redis-server --save 60 1 --loglevel info

volumes:
  pgdata:
    driver: local